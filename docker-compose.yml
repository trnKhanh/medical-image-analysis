version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/arm64/v8
    container_name: active-learning-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - WORKSPACE_BASE_PATH=/app/workspaces
      - MODELS_DIR=/app/models
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
    volumes:
      - workspace_data:/app/workspaces
      - model_data:/app/models
      - log_data:/app/logs
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ./src/entry/demo/view
      dockerfile: Dockerfile
      platforms:
        - linux/arm64/v8
    container_name: active-learning-frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

networks:
  app-network:
    driver: bridge

volumes:
  workspace_data:
    driver: local
  model_data:
    driver: local
  log_data:
    driver: local